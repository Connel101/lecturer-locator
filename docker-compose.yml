services:
  postgres:
    image: postgres:18-alpine
    container_name: database
    restart: unless-stopped

    environment:
      POSTGRES_DB: lecturer_locator
      POSTGRES_USER: lecturer_locator
      POSTGRES_PASSWORD: dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: